}

message C_Interact {
    	int32 objectId = 1;
}

message S_Interact  {
    	int32 objectId = 1;
	int32 targetId = 2;
    	int32 keyCode = 3;
	int32 targetKeyCode = 4;
}

message C_EnterGame {
	bool enterGame = 1;
	repeated CharacterType dummyPlayers = 2;
}

message S_EnterGame {
	ObjectInfo player = 1;
}
message S_LeaveGame {

}

message S_State {
	int32 ObjectId = 1;
	CreatureState MyState = 2;
	PositionInfo PosInfo = 3;
	RotationInfo RotInfo = 4;
	MonsterSkill skilltype = 5;
	int32 sequenceId = 6;
	PositionInfo targetPosition = 7;
}

message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn{
  repeated int32 objectIds = 1;
}

message C_Move{
  PositionInfo posInfo = 1;
  RotationInfo rotInfo = 2;
  bool isWarp = 3;
}

message S_Move{
  int32 objectId = 1;
  PositionInfo posInfo = 2;
  RotationInfo rotInfo = 3;
  bool isWarp = 4;
}

message C_Skill{
	ObjectInfo objectInfo = 1;
	SkillInfo skillInfo = 2;
	repeated int32 targetsId = 3; 
	float mousePosX = 4;
	float mousePosZ = 5;
	float chargeRatio = 6;
}

message S_Skill{
	bool canUse = 1;
	int32 objectId = 2;
	SkillInfo skillInfo = 3;
	CostInfo costInfo = 4;
 	float chargeRatio = 5;
	float mousePosX = 6;
	float mousePosZ = 7;
}

message C_SkillLevelUp{
	int32 keyCode = 1;
}

message S_SkillLevelUp{
	int32 keyCode = 1;
}

message C_Fx{
	EffectInfo fxInfo = 1;
}

message S_Fx{
	int32 objectId = 1;
	EffectInfo fxInfo = 2;
}

message C_Anim{
	AnimInfo animInfo = 1;
}

message S_Anim{
	int32 objectId = 1;
	AnimInfo animInfo = 2;
}

message C_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message S_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message C_Trait{
	TraitType traitType = 1;
	int32 pickIdx = 2;
}

message S_Trait{
	TraitType traitType = 1;
	int32 pickIdx = 2;
}

message C_Weapon{
	Weapon weaponType = 1;
	int32 pickIdx = 2;
}

message S_Weapon{
	Weapon weaponType = 1;
	int32 pickIdx = 2;
}

message S_EnterPick{
	int32 pickIdx = 1;
	string userName = 2;
}

message S_SpawnPick{
	repeated PickScenePlayerInfo players = 1;
}

message S_LeavePick{
	int32 pickIdx = 1;
}

message S_ChangeHp{
	int32 objectId = 1;
	float hp = 2;
	float barrier = 3;
}

 message S_Die{
	 int32 objectId = 1;
	 int32 attackerId = 2;
	 float respawnTime = 3;
 }

 message C_Ping{
	bool ping = 1;
}

message S_VisibleObjects{
	int32 objectId = 1;
	repeated int32 visibleObjectIds = 2;
}

message S_LevelUp{
	int32 objectId = 1;
	int32 levelUpCnt = 2;
	StatInfo statGrowth = 3;
}

message C_Ready{
	bool ready = 1;
}

message S_Respawn{
	int32 objectId = 1;
	PositionInfo posInfo = 2;
	RotationInfo rotInfo = 3;
	float hp = 4;
	float stamina = 5;
}

message C_PlayerState{
	int32 objectId = 1;
	CreatureState state = 2;
}

message S_ChangeStat{
	int32 objectId = 1;
	float hp = 2;
	float stamina = 3;
	float barrier = 4;
}

message S_ChangeItemStat{
	int32 objectId = 1;
	ItemStat itemStat = 2;
}

message S_ChangeEquipItem{
	int32 objectId = 1;
	int32 itemId = 2;
}

message S_ChangeInventory{
	repeated ChangeInventoryInfo changes = 1;
}

message C_TestDamage{
	int32 objectId = 1;
}

message C_Projectile{
	int32 objectId = 1;
}
message S_Projectile{
	int32 objectId = 1;
}
message S_CombatText{
	int32 objectId = 1;
	CombatTextType type = 2;
	float value = 3;
}

message S_ChangeKDA{
	repeated KDAInfo KDAs = 1;
}

message S_SyncTimer{
	int32 phase = 1;
	int64 currentTimestamp = 2;
	int64 phaseEndTime = 3;
}

message C_EnvRequest{
	int32 objectId = 1;
	EnvType envType = 2;
}

message S_EnvRequest{
	int32 objectId = 1;
	EnvType envType = 2;
}

message C_TargetingSkill{
	int32 objectId = 1;
	int32 keyCode = 2;
	int32 targetId = 3;
}

message S_AddAbigailCoord{
	int32 objectId = 1;
	float duration = 2;
}

message S_RemoveAbigailCoord{
	int32 objectId = 1;
}

message PositionInfo{
	CreatureState state = 1;
	float posX = 2;
	float posY = 3;
	float posZ = 4;
}

message RotationInfo{
	float qx = 1;
    float qy = 2;
    float qz = 3;
    float qw = 4;
}

message StatInfo{
	float attack = 1;
	float defense = 2;
	float hp = 3;
	float maxHp = 4;
	float hpRegen = 5;
	float barrier = 6;
	float stamina = 7;
	float maxStamina = 8;
	float staminaRegen = 9;
	float attackSpeed = 10;
	float moveSpeed = 11;
	int32 exp = 12;
	int32 level = 13;
	int32 heal = 14;
}

message PlayerInfo {
    CharacterType charType = 1;
    int32 skillPoints = 2;
    int32 team = 3;
	Weapon weapon = 4;
}

message MonsterInfo {
    MonsterType monsterType = 1;
}

message EnvInfo{
    EnvType envType = 1;
    string prefabPath = 2;
    float collectRadius = 3;
    float respawnTime= 4; 
    bool isRespawnable= 5;
    string rewardType= 6; 
    int32 rewardId= 7;
    int32 rewardAmount= 8;
    
    float floatSpeed= 9;
    float floatHeight= 10;
    float rotationSpeed= 11;
}

message ObjectInfo{
	int32 objectId = 1;
	string name = 2;
	PositionInfo posInfo = 3;
	RotationInfo rotInfo = 4;
	StatInfo statInfo = 5;
	oneof objectSpecificData 
	{
        PlayerInfo player = 6;
        MonsterInfo monster = 7;
        EnvInfo env = 8;
    	}
}

message PickScenePlayerInfo{
	int32 pickIdx = 1;
	string userName = 2;
	CharacterType charType = 3;
	TraitType traitType = 4;
	Weapon weaponType = 5;
}

message AnimInfo{
	string name = 1;
	float ratio = 2;
}

message EffectInfo{
	int32 keyCode = 1;
}

message WeaponMasteryInfo{
	float attackSpeed = 1;
	float basicAtkAmp = 2;
	float skillAmp = 3;
}

message WeaponInfo{
	float range = 1;
	float attackSpeed = 2;
}

message SkillInfo{
	int32 skillId = 1;
	int32 keyCode = 2;
	float coolTime = 3;
	int32 targetId = 4;
	bool amplification = 5;
	int32 amplifiKeyCode = 6;
}

message InteractionList {
    repeated string interaction = 1; 
}
message SkillHitbox{
	string shape = 1;
	string type = 2;
	int32 startFrame = 3;
	int32 endFrame = 4;
	int32 fps = 5;
	bool charge = 6;
	float lookOffset = 7;
	float rightOffset = 8;
	float radius = 9;
	float angle = 10;
	float width = 11;
	float height = 12;
	float speed = 13;
	float minRange = 14;
	float maxRange = 15;
	bool isOneTimeUse = 16;
	map<string, InteractionList> interactions = 17;
}

message CostInfo{
	float coolTime = 1;
	float stamina = 2;
}

message ItemStat{
    float AttackDamage = 1;                  //공격력
    float AttackSpeed = 2;                   //공격속도
    float CriticalRatio = 3;                 //치명타 확률
    float CriticalDamage = 4;                //치명타 피해량
    float AttackRange = 5;                   //기본 공격 사거리
    float FixedSkillAmplification = 6;       //고정 스킬 증폭
    float PercentageSkillAmplification = 7;  //퍼센트 스킬 증폭
    float SkillAcceleration = 8;             //스킬 가속
    float FixedDefensePenetration = 9;       //고정 방어 관통
    float PercentageDefensePenetration = 10;  //퍼센트 방어 관통 
    float FixedSpeed = 11;                    //고정 이동 속도
    float PercentageSpeed = 12;               //퍼센트 이동 속도
    float MaxHp = 13;                         //최대 체력
    float HpRegen = 14;                       //체력 재생
    float MaxStamina = 15;                    //최대 스테미나
    float StaminaRegen = 16;                  //스테미나 재생
    float Defense = 17;                       //방어력
    float LifeSteal = 18;                     //생명력 흡수
    float Omnivamp = 19;                      //모든 피해 흡혈
    float HealingPower = 20;                  //주는 회복 증가
    float SlowResistance = 21;                //둔화 효과 저항
    float CCResistance = 22;                  //방해 효과 저항(속박, 기절)
    float AdaptiveStat = 23;                  //적응형 능력치 공격력 : 스킬증폭 = 1 : 2
    float Vision = 24;                        //시야
    float AttackDamagePerLevel = 25;          //레벨 당 공격력
    float SkillAmplificationPerLevel = 26;    //레벨 당 스킬 증폭
    float MaxHpPerLevel = 27;                 //레벨 당 최대 체력
}

message ChangeInventoryInfo{
	int32 itemId = 1;
	int32 inventoryIndex = 2;
	int32 count = 3;
}

message KDAInfo{
	int32 objectId = 1;
	int32 kill = 2;
	int32 death = 3;
	int32 asist = 4;
}