syntax = "proto3";

package Protocol;

option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  C_ENTER_GAME = 0;
  S_ENTER_GAME = 1;
  S_LEAVE_GAME = 2;
  S_SPAWN = 3;
  S_DESPAWN = 4;
  C_MOVE = 5;
  S_MOVE = 6;
  C_SKILL = 7;
  S_SKILL = 8;
  S_CHANGE_HP = 9;
  S_DIE = 10;
  C_ANIM = 11;
  S_ANIM = 12;
}

enum CreatureState{
  IDLE = 0;
  MOVING = 1;
  SKILL = 2;
  DEAD = 3;
}

enum GameObjectType{
	NONE = 0;
	PLAYER = 1;
	MONSTER = 2;
	PROJECTILE = 3;
}

enum SkillType{
	SKILL_NONE = 0;
	SKILL_AUTO = 1;
	SKILL_PROJECTILE = 2;
}

enum AnimType{
	PLAY = 0;
	TRIGGER = 1;
	BOOL = 2;
	FLOAT = 3;
}

message C_EnterGame {
	ObjectInfo player = 1;
}

message S_EnterGame {
	ObjectInfo player = 1;
}

message S_LeaveGame {

}

message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn{
  repeated int32 objectIds = 1;
}

message C_Move{
  PositionInfo posInfo = 1;
  RotationInfo rotInfo = 2;
}

message S_Move{
  int32 objectId = 1;
  PositionInfo posInfo = 2;
  RotationInfo rotInfo = 3;
}

message C_Skill{
	SkillInfo info = 1;
}

message S_Skill{
	int32 objectId = 1;
	SkillInfo info = 2;
}

message C_Anim{
	AnimInfo animInfo = 1;
}

message S_Anim{
	int32 objectId = 1;
	AnimInfo animInfo = 2;
}

message ObjectInfo{
	int32 objectId = 1;
	string name = 2;
	PositionInfo posInfo = 3;
	RotationInfo rotInfo = 4;
	StatInfo statInfo = 5;
}

message AnimInfo{
	int32 hash = 1;
	AnimType type = 2;
	float value = 3;
	float time = 4;
}

message S_ChangeHp{
	int32 objectId = 1;
	int32 hp = 2;
}

 message S_Die{
	 int32 objectId = 1;
	 int32 attackerId = 2;
 }

message PositionInfo{
	CreatureState state = 1;
	float posX = 2;
	float posY = 3;
	float posZ = 4;
}

message RotationInfo{
	float qx = 1;
    float qy = 2;
    float qz = 3;
    float qw = 4;
}

message StatInfo{
	int32 level = 1;
	int32 hp = 2;
	int32 maxHp = 3;
	int32 attack = 4;
	float speed = 5;
	int32 totalHp = 6;
}

message SkillInfo{
	int32 skillId = 1;
	string name = 2;
}