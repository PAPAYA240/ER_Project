syntax = "proto3";

package Protocol;

option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  C_ENTER_GAME = 0;
  S_ENTER_GAME = 1;
  S_LEAVE_GAME = 2;
  S_SPAWN = 3;
  S_DESPAWN = 4;
  C_MOVE = 5;
  S_MOVE = 6;
  C_SKILL = 7;
  S_SKILL = 8;
  S_CHANGE_HP = 9;
  S_DIE = 10;
  C_ANIM = 11;
  S_ANIM = 12;
  C_CHARACTER = 13;
  S_STATE = 14;
  C_SKILL_END = 15;
  S_CHARACTER = 16;
  S_ENTER_PICK = 17;
  S_LEAVE_PICK = 18;
  C_PING = 19;
  S_VISIBLE_OBJECTS = 20;
}

enum CreatureState{
  IDLE = 0;
  MOVING = 1;
  SKILL = 2;
  DEAD = 3;
}

enum GameObjectType{
	NONE = 0;
	PLAYER = 1;
	MONSTER = 2;
	PROJECTILE = 3;
}

enum SkillType{
	SKILL_NONE = 0;
	SKILL_AUTO = 1;
	SKILL_PROJECTILE = 2;
}

enum MonsterSkill
{
    MS_NONE = 0;
    MS_ATTACK1 = 1;
    MS_ATTACK2 = 2;
    MS_SKILL1 = 3;
    MS_SKILL2 = 4;
    MS_SKILL3 = 5;

    MS_DRONE_ATTACK1 = 6;
    MS_DRONE_ATTACK2 = 7;
}

enum AnimType{
	PLAY = 0;
	TRIGGER = 1;
	BOOL = 2;
	FLOAT = 3;
}

enum CharacterType {
	CHARACTER_NONE = 0;
    ROZZI = 1;
    YUKI = 2;
	HYUNWOO = 3;
	ABIGAIL = 4;
	THEODORE = 5;
}

enum MonsterType {
	MONSTER_NONE = 0;
   	 ALPHA = 1;
   	OMEGA = 2;
	DRONE = 3;
}

enum Weapon {
    WEAPON_NONE = 0;
    DAGGER = 1;
    TWO_HANDED_SWORD = 2;
    AXE = 3;
    DUAL_SWORDS = 4;
    PISTOL = 5;
    ASSAULT_RIFLE = 6;
    SNIPER_RIFLE = 7;
    RAPIER = 8;
    SPEAR = 9;
    HAMMER = 10;
    BAT = 11;
    THROW = 12;
    SHURIKEN = 13;
    BOW = 14;
    CROSSBOW = 15;
    GLOVE = 16;
    TONFA = 17;
    GUITAR = 18;
    NUNCHAKU = 19;
    WHIP = 20;
    CAMERA = 21;
    ARCANA = 22;
    V_F_PROSTHETIC = 23;
}

enum SkillShape{
	CIRCLE = 0;
	RECTANGLE = 1;
	SECTOR = 2;
}

message C_EnterGame {
	ObjectInfo player = 1;
}

message S_EnterGame {
	ObjectInfo player = 1;
}

message S_LeaveGame {

}
message S_State
{
	int32 ObjectId = 1;
	CreatureState MyState = 2;
	PositionInfo PosInfo = 3;
	RotationInfo RotInfo = 4;
	MonsterSkill skilltype = 5;
	int32 sequenceId = 6;
}
message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn{
  repeated int32 objectIds = 1;
}

message C_Move{
  PositionInfo posInfo = 1;
  RotationInfo rotInfo = 2;
  bool isWarp = 3;
}

message S_Move{
  int32 objectId = 1;
  PositionInfo posInfo = 2;
  RotationInfo rotInfo = 3;
  bool isWarp = 4;
}

message C_SkillEnd {
	ObjectInfo objectInfo = 1;
	MonsterSkill skillType = 2; 
}

message C_Skill{
	ObjectInfo objectInfo = 1;
	SkillInfo skillInfo = 2;
}

message S_Skill{
	bool canUse = 1;
	int32 objectId = 2;
	SkillInfo skillInfo = 3;
}

message C_Anim{
	AnimInfo animInfo = 1;
}

message S_Anim{
	int32 objectId = 1;
	AnimInfo animInfo = 2;
}

message C_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message S_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message S_EnterPick{
	int32 pickIdx = 1;
}

message S_LeavePick{
	int32 pickIdx = 1;
}

message ObjectInfo{
	int32 objectId = 1;
	string name = 2;
	PositionInfo posInfo = 3;
	RotationInfo rotInfo = 4;
	StatInfo statInfo = 5;
	CharacterType charType = 6;
	MonsterType monsterType = 7;
	int32 team = 8;
}

message AnimInfo{
	string name = 1;
	float ratio = 2;
}

message S_ChangeHp{
	int32 objectId = 1;
	int32 hp = 2;
}

 message S_Die{
	 int32 objectId = 1;
	 int32 attackerId = 2;
 }

message PositionInfo{
	CreatureState state = 1;
	float posX = 2;
	float posY = 3;
	float posZ = 4;
}

message RotationInfo{
	float qx = 1;
    float qy = 2;
    float qz = 3;
    float qw = 4;
}

message StatInfo{
	string name = 1;
	float attack = 2;
	float defense = 3;
	int32 hp = 4;
	int32 maxHp = 5;
	float hpRegen = 6;
	int32 stamina = 7;
	float staminaRegen = 8;
	float attackSpeed = 9;
	float moveSpeed = 10;
}

message WeaponMasteryInfo{
	float attackSpeed = 1;
	float basicAtkAmp = 2;
	float skillAmp = 3;
}

message WeaponInfo{
	float range = 1;
	float attackSpeed = 2;
}

message SkillInfo{
	int32 skillId = 1;
	int32 keyCode = 2;
	string name = 3;
}

message C_Ping{
	bool ping = 1;
}

message S_VisibleObjects{
	int32 objectId = 1;
	repeated int32 visibleObjectIds = 2;
}
