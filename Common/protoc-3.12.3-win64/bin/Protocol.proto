syntax = "proto3";

package Protocol;

option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  C_ENTER_GAME = 0;
  S_ENTER_GAME = 1;
  S_LEAVE_GAME = 2;
  S_SPAWN = 3;
  S_DESPAWN = 4;
  C_MOVE = 5;
  S_MOVE = 6;
  C_SKILL = 7;
  S_SKILL = 8;
  S_CHANGE_HP = 9;
  S_DIE = 10;
  C_ANIM = 11;
  S_ANIM = 12;
  C_CHARACTER = 13;
  S_STATE = 14;
  C_FX = 15;
  S_CHARACTER = 16;
  S_ENTER_PICK = 17;
  S_SPAWN_PICK = 18;
  S_LEAVE_PICK = 19;
  C_PING = 20;
  S_VISIBLE_OBJECTS = 21;
  S_LEVEL_UP = 22;
  C_READY = 23;
  S_FX = 24;
  C_TRAIT = 25;
  S_TRAIT = 26;
  C_WEAPON = 27;
  S_WEAPON = 28;
  C_INTERACT = 29;
  S_INTERACT = 30;
  S_RESPAWN = 31;
  C_SKILL_LEVEL_UP = 32;
  S_SKILL_LEVEL_UP = 33;
  C_PLAYER_STATE = 34;
  S_CHANGE_STAT = 35;
  C_ATTACK_SKILL_TARGET = 36;
}

enum CreatureState{
  IDLE = 0;
  MOVING = 1;
  ATTACK = 2;
  SKILL = 3;
  DEAD = 4;
  REST = 5;
}

enum GameObjectType{
	NONE = 0;
	PLAYER = 1;
	MONSTER = 2;
	PROJECTILE = 3;
	ENVIRONMENT = 4;
}

enum EnvType{
   ENV_NONE = 0;
   HILL_OBJ = 1;
   DEVICE_SPAWNPOINT = 2;
   TURRET = 3;
   ACCBOUNDARY_SPAWNPOINT = 4;
   BARRIER_SPAWNPOINT = 5;
}
   
enum SkillType{
	SKILL_NONE = 0;
	SKILL_AUTO = 1;
	SKILL_PROJECTILE = 2;
	SKILL_STATIC = 3;
	SKILL_TRACK = 4;
}

enum MonsterSkill{
    MS_NONE = 0;
    MS_ATTACK1 = 1;
    MS_ATTACK2 = 2;
    MS_SKILL1 = 3;
    MS_SKILL2 = 4;
    MS_SKILL3 = 5;

    MS_DRONE_ATTACK1 = 6;
    MS_DRONE_ATTACK2 = 7;

    MS_GAMMA_ATTACK1 = 8;
    MS_GAMMA_SKILL1 = 9;
    MS_GAMMA_SKILL2 = 10;
    MS_GAMMA_SKILL3 = 11;
}

enum AnimType{
	PLAY = 0;
	TRIGGER = 1;
	BOOL = 2;
	FLOAT = 3;
}

enum CharacterType {
	CHARACTER_NONE = 0;
    ROZZI = 1;
    YUKI = 2;
	HYUNWOO = 3;
	ABIGAIL = 4;
	THEODORE = 5;
}

enum MonsterType {
	MONSTER_NONE = 0;
   	ALPHA = 1;
   	OMEGA = 2;
	DRONE = 3;
        GAMMA = 4;
}

enum Weapon {
    WEAPON_NONE = 0;
    DAGGER = 1;
    TWO_HAND_SWORD = 2;
    AXE = 3;
    DUAL_SWORDS = 4;
    PISTOL = 5;
    ASSAULT_RIFLE = 6;
    SNIPER_RIFLE = 7;
    RAPIER = 8;
    SPEAR = 9;
    HAMMER = 10;
    BAT = 11;
    THROW = 12;
    SHURIKEN = 13;
    BOW = 14;
    CROSSBOW = 15;
    GLOVE = 16;
    TONFA = 17;
    GUITAR = 18;
    NUNCHAKU = 19;
    WHIP = 20;
    CAMERA = 21;
    ARCANA = 22;
    V_F_PROSTHETIC = 23;
}

enum SkillShape{
	SHAPE_NONE = 0;
	CIRCLE = 1;
	RAY = 2;
	RECTANGLE = 3;
	SECTOR = 4;
}

enum TraitType{
	FRAILTY_INFLICTION = 0;		
    VAMPIRIC_BLOODLINE = 1;		
    ADRENALINE = 2;		
    ACCELERATER = 3;		
    STELLAR_CHARGE = 4;		
    GHOST_LIGHT = 5;		
    RED_SPRITE = 6;		
    SIPHON_MAELSTORM = 7;		
    DIAMOND_SHARD = 8;		
    IRONCLAD = 9;		
    HEAVY_KNEEPADS = 10;	
    BITTER_RETRIBUTION = 11;	
    HEALING_FACTOR = 12;	
    AMPLIFICATION_DRONE = 13;	
    HEALING_DRONE = 14;	
    SENTINEL = 15;	
}

message C_Interact {
    int32 objectId = 1;
}

message S_Interact  {
    int32 objectId = 1;
    int64 nextUseTime = 2;
}

message C_EnterGame {
	bool enterGame = 1;
}

message S_EnterGame {
	ObjectInfo player = 1;
}

message S_LeaveGame {

}

message S_State {
	int32 ObjectId = 1;
	CreatureState MyState = 2;
	PositionInfo PosInfo = 3;
	RotationInfo RotInfo = 4;
	MonsterSkill skilltype = 5;
	int32 sequenceId = 6;
	PositionInfo targetPosition = 7;
}

message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn{
  repeated int32 objectIds = 1;
}

message C_Move{
  PositionInfo posInfo = 1;
  RotationInfo rotInfo = 2;
  bool isWarp = 3;
}

message S_Move{
  int32 objectId = 1;
  PositionInfo posInfo = 2;
  RotationInfo rotInfo = 3;
  bool isWarp = 4;
}

message C_Skill{
	ObjectInfo objectInfo = 1;
	SkillInfo skillInfo = 2;
	int32 targetId = 3;
}

message S_Skill{
	bool canUse = 1;
	int32 objectId = 2;
	SkillInfo skillInfo = 3;
	CostInfo costInfo = 4;
}

message C_SkillLevelUp{
	int32 keyCode = 1;
}

message S_SkillLevelUp{
	int32 keyCode = 1;
}

message C_Fx{
	EffectInfo fxInfo = 1;
}

message S_Fx{
	int32 objectId = 1;
	EffectInfo fxInfo = 2;
}

message C_Anim{
	AnimInfo animInfo = 1;
}

message S_Anim{
	int32 objectId = 1;
	AnimInfo animInfo = 2;
}

message C_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message S_Character{
	CharacterType charType = 1;
	int32 pickIdx = 2;
}

message C_Trait{
	TraitType traitType = 1;
	int32 pickIdx = 2;
}

message S_Trait{
	TraitType traitType = 1;
	int32 pickIdx = 2;
}

message C_Weapon{
	Weapon weaponType = 1;
	int32 pickIdx = 2;
}

message S_Weapon{
	Weapon weaponType = 1;
	int32 pickIdx = 2;
}

message S_EnterPick{
	int32 pickIdx = 1;
	string userName = 2;
}

message S_SpawnPick{
	repeated PickScenePlayerInfo players = 1;
}

message S_LeavePick{
	int32 pickIdx = 1;
}

message S_ChangeHp{
	int32 objectId = 1;
	float hp = 2;
}

 message S_Die{
	 int32 objectId = 1;
	 int32 attackerId = 2;
	 float respawnTime = 3;
 }

 message C_Ping{
	bool ping = 1;
}

message S_VisibleObjects{
	int32 objectId = 1;
	repeated int32 visibleObjectIds = 2;
}

message S_LevelUp{
	int32 objectId = 1;
	int32 levelUpCnt = 2;
	StatInfo statGrowth = 3;
}

message C_Ready{
	bool ready = 1;
}

message S_Respawn{
	int32 objectId = 1;
	PositionInfo posInfo = 2;
	RotationInfo rotInfo = 3;
	float hp = 4;
	float stamina = 5;
}

message C_PlayerState{
	int32 objectId = 1;
	CreatureState state = 2;
}

message S_ChangeStat{
	int32 objectId = 1;
	float hp = 2;
	float stamina = 3;
}

message PositionInfo{
	CreatureState state = 1;
	float posX = 2;
	float posY = 3;
	float posZ = 4;
}

message RotationInfo{
	float qx = 1;
    float qy = 2;
    float qz = 3;
    float qw = 4;
}

message StatInfo{
	float attack = 1;
	float defense = 2;
	float hp = 3;
	float maxHp = 4;
	float hpRegen = 5;
	float stamina = 6;
	float maxStamina = 7;
	float staminaRegen = 8;
	float attackSpeed = 9;
	float moveSpeed = 10;
	int32 exp = 11;
	int32 level = 12;
	int32 hill = 13;
}

message PlayerInfo {
    CharacterType charType = 1;
    int32 skillPoints = 2;
    int32 team = 3;
}

message MonsterInfo {
    MonsterType monsterType = 1;
}

message EnvInfo{
	EnvType envType = 1;
	string interactionStrategy = 2;	
}

message ObjectInfo{
	int32 objectId = 1;
	string name = 2;
	PositionInfo posInfo = 3;
	RotationInfo rotInfo = 4;
	StatInfo statInfo = 5;
	CharacterType charType = 6;
	MonsterType monsterType = 7;
	EnvType envType = 8;
	int32 team = 9;
	oneof objectSpecificData 
	{
        PlayerInfo player = 10;
        MonsterInfo monster = 11;
        EnvInfo env = 12;
    	}
}

message PickScenePlayerInfo{
	int32 pickIdx = 1;
	string userName = 2;
	CharacterType charType = 3;
	TraitType traitType = 4;
	Weapon weaponType = 5;
}

message AnimInfo{
	string name = 1;
	float ratio = 2;
}

message EffectInfo{
	int32 keyCode = 1;
}

message WeaponMasteryInfo{
	float attackSpeed = 1;
	float basicAtkAmp = 2;
	float skillAmp = 3;
}

message WeaponInfo{
	float range = 1;
	float attackSpeed = 2;
}

message SkillInfo{
	int32 skillId = 1;
	int32 keyCode = 2;
	float coolTime = 3;
	int32 targetId = 4;
}

message SkillHitbox{
	string shape = 1;
	string type = 2;
	bool charge = 3;
	float lookOffset = 4;
	float rightOffset = 5;
	float dirX = 6;
	float dirY = 7;
	float radius = 8;
	float angle = 9;
	float width = 10;
	float height = 11;
	float duration = 12;
	float speed = 13;
	float minRange = 14;
	float maxRange = 15;
}

message CostInfo{
	float coolTime = 1;
	float stamina = 2;
}

message C_AttackSkillTarget{
	bool attack = 1;
}