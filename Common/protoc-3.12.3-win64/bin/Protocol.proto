}

message S_SkillMotion {
  int32  objectId   = 1;
  SkillMotionType type = 2;
  float  startX     = 3;
  float  startY     = 4;
  float  startZ     = 5;
  float  endX       = 6;
  float  endY       = 7;
  float  endZ       = 8;
  bool   authoritativeEnd = 9;		// 끝난 시점에 서버 좌표가 권위
  float  duration   = 10;			// 초; 0이면 즉시(블링크) // 여기 이하 안쓰는 중 
  string anim       = 11;			// 옵션
  string curveId    = 12;			// 클라 보간커브 선택(옵션)
  bool   serverCollision = 13;		// 서버가 충돌 반영해 준 결과임
  repeated float keyframes = 14;	// [x0,y0,z0,t0, x1,y1,z1,t1, ...] (옵션)
}

